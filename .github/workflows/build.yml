name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true
      - name: Android loyihasini tayyorlash
        run: |
          flutter create --platforms=android --project-name wifi_app --org uz.kuzatuv .
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 24/g; s/minSdk = .*/minSdk = 24/g; s/compileSdkVersion .*/compileSdkVersion 35/g; s/compileSdk = .*/compileSdk = 35/g' {} +
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          M=android/app/src/main/AndroidManifest.xml
          sed -i -e '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' -e '/<application/i <uses-permission android:name="android.permission.CAMERA"/>' -e '/<application/i <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' -e '/<application/i <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' -e '/<application/i <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>' -e '/<application/i <uses-feature android:name="android.hardware.camera" android:required="false"/>' $M
          sed -i 's/android:label="[^"]*"/android:label="Wi-Fi Boshqaruv"/' $M
          cat << 'EOF' > pubspec.yaml
          name: wifi_app
          description: Wi-Fi Boshqaruv
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            camera: ^0.11.0+2
            url_launcher: ^6.3.1
            permission_handler: ^11.3.1
          flutter:
            uses-material-design: true
          EOF
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'dart:typed_data';
          import 'package:camera/camera.dart';
          import 'package:flutter/material.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:url_launcher/url_launcher.dart';

          const int controlPort = 4545, videoPort = 4546, discoveryPort = 4547;
          List<CameraDescription> cameras = [];

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'Wi-Fi Boshqaruv',
              theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal, brightness: Brightness.dark)),
              home: const Home(),
            ));
          }

          class _Found {
            _Found(this.name, this.seen);
            String name;
            DateTime seen;
          }

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            final String myName = 'Telefon-${Random().nextInt(900) + 100}';
            final String myCode = (Random.secure().nextInt(9000) + 1000).toString();
            final List<String> myIps = [];
            final Map<String, _Found> found = {};
            final Set<String> allowed = {};
            final Map<String, int> fails = {};
            final TextEditingController link = TextEditingController();
            String status = 'Qurilmalar qidirilmoqda...';
            String? peerIp, peerName, streamTo;
            ServerSocket? control, videoServer;
            RawDatagramSocket? udp;
            Timer? tick;
            CameraController? cam;
            Socket? videoSock;
            bool streaming = false, asking = false;
            Uint8List? frame;

            @override
            void initState() {
              super.initState();
              start();
            }

            @override
            void dispose() {
              tick?.cancel();
              control?.close();
              videoServer?.close();
              udp?.close();
              cam?.dispose();
              videoSock?.destroy();
              link.dispose();
              super.dispose();
            }

            // ---------- tarmoq ----------
            Future<void> start() async {
              try {
                for (final i in await NetworkInterface.list(type: InternetAddressType.IPv4)) {
                  for (final a in i.addresses) {
                    if (!a.isLoopback) myIps.add(a.address);
                  }
                }
                control = await ServerSocket.bind(InternetAddress.anyIPv4, controlPort, shared: true);
                control!.listen(onConnection);
                udp = await RawDatagramSocket.bind(InternetAddress.anyIPv4, discoveryPort);
                udp!.broadcastEnabled = true;
                udp!.listen(onUdp);
                tick = Timer.periodic(const Duration(seconds: 2), (_) => announce());
                announce();
                if (mounted) setState(() => status = 'Tayyor. Ikkinchi telefonni tanlang va uning kodini kiriting.');
              } catch (e) {
                if (mounted) setState(() => status = 'Tarmoq xatosi: $e');
              }
            }

            void announce() {
              final data = utf8.encode(jsonEncode({'app': 'wifi-boshqaruv', 'name': myName}));
              final targets = <String>{'255.255.255.255'};
              for (final ip in myIps) {
                final p = ip.split('.');
                if (p.length == 4) targets.add('${p[0]}.${p[1]}.${p[2]}.255');
              }
              for (final t in targets) {
                try {
                  udp?.send(data, InternetAddress(t), discoveryPort);
                } catch (_) {}
              }
              final now = DateTime.now();
              found.removeWhere((_, f) => now.difference(f.seen).inSeconds > 8);
              if (mounted) setState(() {});
            }

            void onUdp(RawSocketEvent e) {
              if (e != RawSocketEvent.read) return;
              final dg = udp?.receive();
              if (dg == null) return;
              final ip = dg.address.address;
              if (myIps.contains(ip)) return;
              try {
                final m = jsonDecode(utf8.decode(dg.data));
                if (m is Map && m['app'] == 'wifi-boshqaruv') {
                  found[ip] = _Found(m['name']?.toString() ?? ip, DateTime.now());
                }
              } catch (_) {}
            }

            void onConnection(Socket c) {
              final ip = c.remoteAddress.address;
              utf8.decoder.bind(c).transform(const LineSplitter()).listen((line) {
                try {
                  final m = jsonDecode(line);
                  if (m is Map) onMessage(Map<String, dynamic>.from(m), ip, c);
                } catch (_) {}
              }, onError: (_) {}, cancelOnError: true);
            }

            void onMessage(Map<String, dynamic> m, String ip, Socket c) {
              final t = m['t'];
              final who = found[ip]?.name ?? ip;
              if (t == 'PAIR') {
                final n = fails[ip] ?? 0;
                if (n >= 5) {
                  c.destroy();
                  return;
                }
                if (m['code'] == myCode) {
                  fails[ip] = 0;
                  allowed.add(ip);
                  c.write('OK\n');
                  if (mounted) setState(() => status = '$who sizga ulandi');
                } else {
                  fails[ip] = n + 1;
                  c.write('NO\n');
                }
                c.flush().then((_) => c.close()).catchError((_) {});
                return;
              }
              if (t == 'DENY' && ip == peerIp) {
                if (mounted) setState(() => status = 'Ruxsat berilmadi');
                return;
              }
              if (!allowed.contains(ip)) return;
              if (t == 'REQ_CAM') {
                ask('Kamera so\'rovi', '$who kameramni ko\'rmoqchi. Ruxsat berasizmi?', () => startStream(ip),
                    onNo: () => send(ip, {'t': 'DENY'}));
              } else if (t == 'STOP') {
                stopStream();
              } else if (t == 'URL') {
                final uri = Uri.tryParse('${m['u']}');
                if (uri == null || !(uri.scheme == 'http' || uri.scheme == 'https')) return;
                ask('Havola so\'rovi', '$who havolani ochmoqchi:\n$uri', () async {
                  try {
                    await launchUrl(uri, mode: LaunchMode.externalApplication);
                  } catch (_) {}
                });
              }
            }

            Future<String?> send(String ip, Map<String, dynamic> msg, {bool wait = false}) async {
              try {
                final s = await Socket.connect(ip, controlPort, timeout: const Duration(seconds: 3));
                s.write('${jsonEncode(msg)}\n');
                await s.flush();
                if (!wait) {
                  await s.close();
                  return 'OK';
                }
                final line = await utf8.decoder
                    .bind(s)
                    .transform(const LineSplitter())
                    .first
                    .timeout(const Duration(seconds: 3));
                s.destroy();
                return line;
              } catch (_) {
                return null;
              }
            }

            // ---------- amallar ----------
            Future<void> pair(String ip, String name) async {
              final code = await askText('$name kodi', 'Ikkinchi telefondagi 4 xonali kod', number: true);
              if (code == null || code.isEmpty) return;
              final r = await send(ip, {'t': 'PAIR', 'code': code}, wait: true);
              if (!mounted) return;
              setState(() {
                if (r == 'OK') {
                  peerIp = ip;
                  peerName = name;
                  status = '$name bilan ulandi';
                } else {
                  status = r == 'NO' ? 'Kod noto\'g\'ri' : 'Ulanib bo\'lmadi';
                }
              });
            }

            Future<void> manual() async {
              final ip = await askText('IP manzil', 'Masalan 192.168.1.25');
              if (ip != null && ip.isNotEmpty) await pair(ip, ip);
            }

            Future<void> viewCamera() async {
              final ip = peerIp;
              if (ip == null) return;
              await videoServer?.close();
              videoServer = await ServerSocket.bind(InternetAddress.anyIPv4, videoPort, shared: true);
              videoServer!.listen((s) {
                if (s.remoteAddress.address != peerIp) {
                  s.destroy();
                  return;
                }
                final bb = BytesBuilder();
                s.listen((Uint8List d) {
                  bb.add(d);
                  while (true) {
                    final all = bb.toBytes();
                    if (all.length < 4) break;
                    final len = ByteData.sublistView(all, 0, 4).getUint32(0);
                    if (len > 3000000) {
                      s.destroy();
                      break;
                    }
                    if (all.length < 4 + len) break;
                    final img = Uint8List.fromList(all.sublist(4, 4 + len));
                    bb.clear();
                    bb.add(all.sublist(4 + len));
                    if (mounted) {
                      setState(() {
                        frame = img;
                        status = 'Kamera ko\'rsatilmoqda';
                      });
                    }
                  }
                }, onDone: () {
                  if (mounted) setState(() => status = 'Kamera uzildi');
                }, onError: (_) {}, cancelOnError: true);
              });
              final r = await send(ip, {'t': 'REQ_CAM'});
              if (mounted) setState(() => status = r == null ? 'Ulanib bo\'lmadi' : 'Ruxsat kutilmoqda...');
            }

            Future<void> startStream(String ip) async {
              try {
                if (!(await Permission.camera.request()).isGranted) {
                  if (mounted) setState(() => status = 'Kamera ruxsati berilmadi');
                  return;
                }
                if (cameras.isEmpty) cameras = await availableCameras();
                if (cameras.isEmpty) return;
                final ctrl = CameraController(cameras.first, ResolutionPreset.medium, enableAudio: false);
                await ctrl.initialize();
                try {
                  await ctrl.setFlashMode(FlashMode.off);
                } catch (_) {}
                final sock = await Socket.connect(ip, videoPort, timeout: const Duration(seconds: 4));
                cam = ctrl;
                videoSock = sock;
                streaming = true;
                streamTo = ip;
                if (mounted) setState(() {});
                while (streaming && cam == ctrl) {
                  final pic = await ctrl.takePicture();
                  final bytes = await pic.readAsBytes();
                  try {
                    await File(pic.path).delete();
                  } catch (_) {}
                  final hdr = ByteData(4)..setUint32(0, bytes.length);
                  sock.add(hdr.buffer.asUint8List());
                  sock.add(bytes);
                  await sock.flush();
                  await Future.delayed(const Duration(milliseconds: 80));
                }
              } catch (_) {}
              await stopStream();
            }

            Future<void> stopStream() async {
              final c = cam, s = videoSock;
              streaming = false;
              cam = null;
              videoSock = null;
              streamTo = null;
              try {
                s?.destroy();
              } catch (_) {}
              try {
                await c?.dispose();
              } catch (_) {}
              if (mounted) setState(() {});
            }

            Future<void> sendLink() async {
              final u = link.text.trim();
              final uri = Uri.tryParse(u);
              if (peerIp == null || uri == null || !(uri.scheme == 'http' || uri.scheme == 'https')) {
                snack('Havola http:// yoki https:// bilan boshlansin');
                return;
              }
              final r = await send(peerIp!, {'t': 'URL', 'u': u});
              snack(r == null ? 'Yuborib bo\'lmadi' : 'Yuborildi, ruxsat kutilmoqda');
            }

            Future<void> disconnect() async {
              final ip = peerIp;
              if (ip != null) await send(ip, {'t': 'STOP'});
              await videoServer?.close();
              videoServer = null;
              if (mounted) {
                setState(() {
                  peerIp = null;
                  peerName = null;
                  frame = null;
                  status = 'Uzildi';
                });
              }
            }

            // ---------- oynalar ----------
            void snack(String t) {
              if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(t)));
            }

            Future<void> ask(String title, String text, FutureOr<void> Function() onYes,
                {FutureOr<void> Function()? onNo}) async {
              if (asking || !mounted) return;
              asking = true;
              final ok = await showDialog<bool>(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(title: Text(title), content: Text(text), actions: [
                  TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('Rad etish')),
                  FilledButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('Ruxsat berish')),
                ]),
              );
              asking = false;
              if (ok == true) {
                await onYes();
              } else if (onNo != null) {
                await onNo();
              }
            }

            Future<String?> askText(String title, String hint, {bool number = false}) {
              final c = TextEditingController();
              return showDialog<String>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text(title),
                  content: TextField(
                      controller: c,
                      autofocus: true,
                      keyboardType: number ? TextInputType.number : TextInputType.text,
                      decoration: InputDecoration(hintText: hint)),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Bekor')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, c.text.trim()), child: const Text('OK')),
                  ],
                ),
              );
            }

            // ---------- ko'rinish ----------
            @override
            Widget build(BuildContext context) {
              final cs = Theme.of(context).colorScheme;
              final title = Theme.of(context).textTheme.titleMedium;
              return Scaffold(
                appBar: AppBar(title: const Text('Wi-Fi Boshqaruv')),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  Card(
                      child: Padding(
                          padding: const EdgeInsets.all(16),
                          child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            Text(myName, style: title),
                            Text(myIps.isEmpty ? 'Wi-Fi ulanmagan' : myIps.join(', '),
                                style: TextStyle(color: cs.onSurfaceVariant)),
                            const SizedBox(height: 12),
                            Text('Sizning kod', style: TextStyle(color: cs.onSurfaceVariant)),
                            Text(myCode,
                                style: const TextStyle(fontSize: 40, fontWeight: FontWeight.bold, letterSpacing: 8)),
                            const SizedBox(height: 8),
                            Text(status),
                          ]))),
                  if (streaming)
                    Card(
                        color: cs.errorContainer,
                        child: ListTile(
                            leading: const Icon(Icons.videocam),
                            title: Text('Kamerangiz $streamTo ga ulashilmoqda'),
                            trailing: FilledButton(onPressed: stopStream, child: const Text('To\'xtatish')))),
                  const SizedBox(height: 12),
                  Text('Topilgan qurilmalar', style: title),
                  if (found.isEmpty)
                    const Padding(
                        padding: EdgeInsets.symmetric(vertical: 12),
                        child: Text('Hali topilmadi. Ikkala telefonda ilova ochiq va bir Wi-Fi\'da bo\'lsin.')),
                  for (final e in found.entries)
                    Card(
                        child: ListTile(
                            leading: const Icon(Icons.smartphone),
                            title: Text(e.value.name),
                            subtitle: Text(e.key),
                            trailing: FilledButton(
                                onPressed: () => pair(e.key, e.value.name), child: const Text('Ulanish')))),
                  TextButton.icon(
                      onPressed: manual,
                      icon: const Icon(Icons.edit),
                      label: const Text('IP manzilni qo\'lda kiritish')),
                  if (peerIp != null) ...[
                    const SizedBox(height: 8),
                    Card(
                        child: Padding(
                            padding: const EdgeInsets.all(16),
                            child: Column(crossAxisAlignment: CrossAxisAlignment.stretch, children: [
                              Text('Ulangan: $peerName ($peerIp)', style: title),
                              const SizedBox(height: 12),
                              FilledButton.icon(
                                  onPressed: viewCamera,
                                  icon: const Icon(Icons.videocam),
                                  label: const Text('Kamerasini ko\'rish')),
                              const SizedBox(height: 12),
                              TextField(
                                  controller: link,
                                  keyboardType: TextInputType.url,
                                  decoration: const InputDecoration(
                                      border: OutlineInputBorder(), labelText: 'Havola (https://...)')),
                              const SizedBox(height: 8),
                              FilledButton.tonalIcon(
                                  onPressed: sendLink,
                                  icon: const Icon(Icons.open_in_new),
                                  label: const Text('Ikkinchi telefonda ochish')),
                              const SizedBox(height: 8),
                              OutlinedButton(onPressed: disconnect, child: const Text('Uzish')),
                            ]))),
                  ],
                  if (frame != null) ...[
                    const SizedBox(height: 12),
                    ClipRRect(
                        borderRadius: BorderRadius.circular(12),
                        child: Image.memory(frame!, gaplessPlayback: true, fit: BoxFit.contain)),
                  ],
                ]),
              );
            }
          }
          EOF
      - name: APK yig'ish
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-boshqaruv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
